<!DOCTYPE html>
<html lang="es">
<!--
  ═══════════════════════════════════════════════════════
  17 · INVITACIÓN A UN EVENTO (variante del cartel)
  ═══════════════════════════════════════════════════════
  idea: si el cartel (08) grita, la invitación susurra.
  una tarjeta elegante que "llega" al abrir la página
  (animación de entrada), con borde clásico, tipografía
  serif y un botón de confirmar que abre el correo ya
  escrito (mailto: — el truco más viejo y más útil).

  SOLO HTML + CSS (el mailto no es js, es un enlace).
  conceptos: animación de entrada, bordes dobles,
  letter-spacing, mailto con asunto y cuerpo.

  se envía pasando el enlace de gh pages por whatsapp:
  la invitación ES la web. para eso: renombrar a index.html
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>estás invitada</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: Georgia, "Times New Roman", serif;
      /* fondo de terciopelo: un degradado radial oscuro */
      background: radial-gradient(circle at 50% 30%, #2b2140, #14101f 70%);
    }

    /* ─────────────────────────────────────────
       LA TARJETA
       border doble + un segundo marco interior
       hecho con outline desplazado: papel bueno.
       ───────────────────────────────────────── */
    .tarjeta {
      background: #f6f1e5;
      color: #2b2140;
      max-width: 420px;
      width: 100%;
      padding: 3rem 2.5rem;
      text-align: center;
      border: 3px double #b39b52;         /* doble filete dorado */
      outline: 1px solid #b39b52;         /* segundo marco */
      outline-offset: 6px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);

      /* animación de llegada: definida abajo en @keyframes */
      animation: llegar 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      /* both = respeta el estado inicial antes de empezar */
    }

    @keyframes llegar {
      from {
        opacity: 0;
        transform: translateY(60px) rotate(-2deg) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0) scale(1);
      }
    }

    /* los adornos, con retraso para que entren después */
    .tarjeta > * {
      animation: aparecer 0.8s ease both;
    }
    /* cada hijo un poco más tarde que el anterior:
       un stagger casero solo con css */
    .tarjeta > *:nth-child(1) { animation-delay: 0.5s; }
    .tarjeta > *:nth-child(2) { animation-delay: 0.65s; }
    .tarjeta > *:nth-child(3) { animation-delay: 0.8s; }
    .tarjeta > *:nth-child(4) { animation-delay: 0.95s; }
    .tarjeta > *:nth-child(5) { animation-delay: 1.1s; }
    .tarjeta > *:nth-child(6) { animation-delay: 1.25s; }
    .tarjeta > *:nth-child(7) { animation-delay: 1.4s; }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .adorno { color: #b39b52; font-size: 1.2rem; letter-spacing: 0.5em; }

    .quien {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: #8a7b5c;
      margin-top: 1.5rem;
    }

    h1 {
      font-weight: normal;
      font-style: italic;
      font-size: 2.1rem;
      line-height: 1.2;
      margin: 1rem 0;
    }

    .detalles {
      font-size: 0.95rem;
      line-height: 1.9;
      margin: 1.5rem 0;
    }

    .detalles strong { letter-spacing: 0.05em; }

    hr {
      border: none;
      border-top: 1px solid #b39b52;
      width: 60px;
      margin: 1.5rem auto;
    }

    /* ─────────────────────────────────────────
       EL BOTÓN MAILTO: un enlace disfrazado.
       mailto: abre el correo del visitante con
       destinatario, asunto y cuerpo ya escritos
       (los espacios se escriben %20).
       ───────────────────────────────────────── */
    .confirmar {
      display: inline-block;
      text-decoration: none;
      color: #f6f1e5;
      background: #2b2140;
      padding: 0.8em 2.2em;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      transition: background 0.3s, letter-spacing 0.3s;
    }

    .confirmar:hover {
      background: #b39b52;
      letter-spacing: 0.35em; /* al pasar el ratón, respira */
    }

    .nota { font-size: 0.75rem; color: #8a7b5c; margin-top: 1.5rem; font-style: italic; }
  </style>
</head>

<body>

  <div class="tarjeta">
    <div class="adorno">✶ ✶ ✶</div>

    <p class="quien">el estudio de la calle inventada</p>

    <h1>tiene el placer de invitarte<br />a su noche abierta</h1>

    <hr />

    <div class="detalles">
      <strong>viernes 13 de septiembre · 19 h</strong><br />
      c/ inventada 42, bajos<br />
      obra reciente · vino tibio · conversación larga
    </div>

    <!-- cambiad el correo, el asunto y el cuerpo.
         %20 = espacio, %0A = salto de línea -->
    <a
      class="confirmar"
      href="mailto:hola@ejemplo.com?subject=Voy%20a%20la%20noche%20abierta&body=cuenta%20conmigo.%0Asomos%20___%20personas."
    >confirmar asistencia</a>

    <p class="nota">se ruega puntualidad impuntual</p>
  </div>

</body>
</html>
